# Official ZMK split central; five host BT profiles plus two halves.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Pinned ZMK gates BOTH battery event implementations on this option.
# Keep enabled while peripheral battery fetching is enabled.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Identify this actual firmware separately from older/default builds.
CONFIG_ZMK_KEYBOARD_NAME="MODU-C Mac v3"
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_KEYMAP_SETTINGS_STORAGE=n

# Restore the original UI and its monochrome theme, not the v3 custom screen.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_MODU_DONGLE_STATUS_SCREEN=y
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_MODU_DONGLE_HAS_BATTERY=y
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y
CONFIG_ZMK_HID_INDICATORS=y

# Full, page-aligned 128x64 monochrome buffer, including LVGL's palette bytes.
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=y
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_DPI_DEF=148
# Use the custom screen's own styles. Built-in widget themes add borders,
# padding and scrollbars to upstream output/modifier containers. These flags
# do NOT control monochrome pixels: keep LV_COLOR_DEPTH_1 and buffers above.
CONFIG_LV_USE_THEME_MONO=n
CONFIG_LV_USE_THEME_DEFAULT=n
CONFIG_LV_USE_THEME_SIMPLE=n
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_UNSCII_8=y
CONFIG_LV_USE_LABEL=y

# Keep OLED rendering/I2C out of the keyboard and Bluetooth work queue.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=50

# v6: verified L/R samples + voltage + sensor status, not BAS zero alone.
CONFIG_MODU_BATTERY_TELEMETRY_CENTRAL=y
