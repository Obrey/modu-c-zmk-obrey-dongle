# Nice!nano v2 + the user's SH1106 OLED. No Corne v0.3 RPC modules.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
CONFIG_ZMK_USB=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SLEEP=n
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_EXT_POWER=y
# USB-powered dongle has no battery of its own. Do not report a fake 0%.
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_BT_BAS=n
# Still fetch peripheral values for diagnostics/future UI, not a sensor repair.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
