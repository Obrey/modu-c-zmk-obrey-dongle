# MODU-C v14: same power policy on charging/USB and battery power.
# 10 min: connected ZMK IDLE (polling stays alive, so key/trackball wakes immediately).
# 2 h: ZMK Deep Sleep/System OFF for much lower long-term drain.
#
# Important hardware limitation: MODU-C's vendor PMW3610 path may require polling,
# so key/trackball wake from Deep Sleep is NOT guaranteed. Reset or power-cycle is
# the reliable wake method after the 2-hour Deep Sleep threshold.
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y

# Keep battery/status work light while connected-idle is active.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_MODU_STATUS_LED_BRIGHTNESS=6
CONFIG_MODU_BATTERY_ACTIVE_INTERVAL=60
CONFIG_MODU_BATTERY_IDLE_INTERVAL=300

# Charging remains fully usable: keys, trackball and split BLE are not throttled.
# Status LED stays suppressed while charging and custom battery diagnostics are
# sampled less often. The 2-hour Deep Sleep timeout is the same on both power sources.
CONFIG_MODU_CHARGE_MODE=y
CONFIG_MODU_BATTERY_CHARGE_INTERVAL=600
