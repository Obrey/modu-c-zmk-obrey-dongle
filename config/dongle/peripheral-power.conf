# MODU-C v11: universal low-power / charge-focus sleep for both keyboard halves.
# The vendor left-half config forces polling because it was originally the split central.
# In the dongle architecture both halves are BLE peripherals, so use the normal
# interrupt-driven kscan path (matching the vendor right half) to allow key wake.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# v11: enter System OFF after ~2 minutes of total inactivity even while VBUS/USB
# power is present. ZMK normally blocks deep sleep whenever USB power is detected;
# the halves are BLE peripherals, so the local module intentionally removes that
# USB-power exception without disabling USB power detection/CHG telemetry.
CONFIG_MODU_UNIVERSAL_DEEP_SLEEP=y
CONFIG_MODU_UNIVERSAL_DEEP_SLEEP_TIMEOUT_MS=120000
CONFIG_ZMK_KSCAN_MATRIX_POLLING=n
CONFIG_ZMK_KSCAN_DIRECT_POLLING=n

# Keep battery/status work light while connected. All of this stops in deep sleep.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_MODU_STATUS_LED_BRIGHTNESS=6
CONFIG_MODU_BATTERY_ACTIVE_INTERVAL=60
CONFIG_MODU_BATTERY_IDLE_INTERVAL=300
