# MODU-C v10: real ZMK deep sleep for the two keyboard halves.
# The vendor left-half config forces polling because it was originally the split central.
# In the dongle architecture both halves are BLE peripherals, so use the normal
# interrupt-driven kscan path (matching the vendor right half) to allow key wake.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_KSCAN_MATRIX_POLLING=n
CONFIG_ZMK_KSCAN_DIRECT_POLLING=n

# Keep battery/status work light while connected. All of this stops in deep sleep.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_MODU_STATUS_LED_BRIGHTNESS=6
CONFIG_MODU_BATTERY_ACTIVE_INTERVAL=60
CONFIG_MODU_BATTERY_IDLE_INTERVAL=300
