name: Build MODU-C + Dongle

"on":
  push:
    paths:
      - "config/**"
      - "local-modules/**"
      - "scripts/**"
      - "tests/**"
      - "build.yaml"
      - ".github/workflows/build.yml"
      - "LICENSE*"
      - "LICENSES/**"
      - "NOTICE.md"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modu-c-dongle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configuration and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check layout, build matrix, and source paths
        run: python3 scripts/validate.py
      - name: Test HEX and UF2 safeguards
        run: python3 scripts/selftest.py
      - name: Test boot keys, dongle routing, and all output names
        run: python3 scripts/test_full_config.py
      - name: Native battery logic and adapter tests (not OLED rendering tests)
        run: python3 scripts/test_status.py

  build:
    name: Build keyboard halves, dongle variants, and reset firmware
    needs: validate
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@641514a97db345f499dd50b0360e594270f008fe
    with:
      build_matrix_path: build.yaml
      config_path: config
      fallback_binary: hex
      archive_name: modu-c-dongle-intermediate

  package:
    name: Package board-specific UF2 files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: modu-c-dongle-intermediate
          path: intermediate
      - name: Checkout original pinned UF2 converter
        uses: actions/checkout@v7
        with:
          repository: 22sh22/modu-c-firmware
          ref: bee0bb4b812f63f279eb67e928accc89600b5904
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            tools/uf2
      - name: Convert and structurally verify all six outputs
        run: >-
          python3 scripts/package_firmware.py
          --intermediate intermediate
          --converter upstream/tools/uf2/uf2conv.py
          --output uf2
          --family 0xADA52840
      - name: Recheck final files and copy instructions and licenses
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uf2.py uf2/*.uf2
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md uf2/
          cp -R LICENSES uf2/LICENSES
          cp docs/FLASHING_KO.md uf2/READ_BEFORE_FLASHING_KO.md
          # The three files at the top level are the normal OLED installation.
          mkdir -p uf2/fallback uf2/reset
          mv uf2/modu_dongle.uf2 uf2/fallback/
          mv uf2/settings_reset_modu.uf2 uf2/settings_reset_dongle.uf2 uf2/reset/
          (cd uf2 && find . -type f -name '*.uf2' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: modu-c-dongle-firmware
          path: uf2/
          if-no-files-found: error
